database = "/var/lib/rdns/rdns.sqlite3"
# DNS listeners are disabled until enabled in the management panel.
# dns_udp = "0.0.0.0:53"
# dns_tcp = "0.0.0.0:53"
# doh = "0.0.0.0:443"
# With TLS termination at a reverse proxy, bind doh to loopback and enable doh_http.
# doh_http = true
# To share the loopback admin port instead, leave doh unset and use doh_on_admin.
# doh_on_admin = true
# dot = "0.0.0.0:853"
# doq = "0.0.0.0:853"
admin = "127.0.0.1:3000"
allowed_clients = ["127.0.0.0/8", "::1/128"]
# Initial whitelist only. The console can later select open/whitelist/blacklist
# modes and geographic restrictions; saved SQLite settings take precedence.
# DoH upstream pools, parallel mode, proxies, GeoIP and GFWList routing are
# configured live in the console (or /api/v1/features), not in this TOML file.
# Set paths in the management panel before enabling encrypted listeners.
# certificate = "/etc/rdns/server.crt"
# private_key = "/etc/rdns/server.key"
# Optional extra trusted PEM certificate for internal subscription/DoH/data URLs.
# subscription_ca = "/etc/rdns/subscription-ca.crt"
# Optional override for the bundled InterNIC root hints.
# root_hints = "/etc/rdns/named.root"
query_log_days = 7

# The console Cache page controls optional public-root snapshots and Radar prewarming.
