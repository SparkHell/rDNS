name: build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    # 02:00 Asia/Taipei, 18:00 UTC the previous day.
    - cron: '0 18 * * *'

permissions:
  contents: read

concurrency:
  group: rdns-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify Node.js version
        run: |
          node -p 'process.version'
          node -e "require('node:assert/strict').equal(process.versions.node.split('.')[0], '26')"
          npm --version
      - name: Install frontend dependencies
        run: npm --prefix web ci --no-audit --no-fund
      - name: Build embedded frontend
        run: npm --prefix web run build
      - name: Rust format check
        run: cargo fmt --check
      - name: Install browser for console tests
        if: matrix.runner == 'ubuntu-24.04'
        working-directory: web
        run: npx --no-install playwright-core install chromium --with-deps
      - name: Rust tests
        env:
          RDNS_FEATURE_UI: ${{ matrix.runner == 'ubuntu-24.04' && '1' || '0' }}
        run: cargo test --locked
      - name: Rust lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build binary
        run: cargo build --release --locked --bin rdns
      - name: Verify release binary
        run: cargo test --test smoke release_binary_protocols -- --ignored --nocapture
      - name: Package binary
        env:
          RDNS_PACKAGE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
        run: ./packaging/package.sh
      - name: Verify package checksum
        run: cd release && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: rdns-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RDNS_PACKAGE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: rdns-*
          path: artifacts
      - name: Verify both architecture archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            directory="artifacts/rdns-${target}"
            (cd "$directory" && sha256sum -c SHA256SUMS)
            cp "$directory/rdns-${RDNS_PACKAGE_VERSION}-${target}.tar.gz" release/
          done
          (cd release && sha256sum ./*.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
          test "$(find release -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 2
      - name: Publish rolling nightly
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly
          title="Nightly $(date -u +%Y-%m-%d)"
          notes="Rolling build of main at ${GITHUB_SHA}. Both Linux architectures passed tests and package checksum verification."
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly release/* --clobber
            gh release edit nightly --title "$title" --notes "$notes" --prerelease --latest=false
          else
            gh release create nightly release/* --verify-tag --title "$title" --notes "$notes" --prerelease --latest=false
          fi
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --latest
          fi
